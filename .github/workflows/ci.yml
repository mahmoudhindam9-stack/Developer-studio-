name: Verify Developer Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Electron runtime syntax
        run: node --check electron/main.mjs && node --check electron/preload.cjs
      - name: Verify Juba isolation
        run: npm run verify:isolation
      - name: Type check
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
